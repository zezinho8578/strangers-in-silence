<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LambdaOS - Dramatic Clocks</title>
<link rel="stylesheet" href="/style.css">
<script>
let currentUser = sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser');
if (!currentUser) window.location.replace("/");
</script>
<style>
#top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--theme-color);
    padding-bottom: 10px;
    margin-right: 180px;
}
.nav-link {
    color: var(--theme-color);
    text-decoration: none;
    cursor: pointer;
}
.nav-link:hover {
    background: var(--theme-color);
    color: var(--bg-color);
    text-shadow: none;
}
/* Page title — centred, modest size */
.page-title {
    text-align: center;
    font-size: 1.2em;
    letter-spacing: 2px;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--theme-color);
    padding-bottom: 8px;
}
/* Tab bar — matches character.html */
.tab-bar {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--theme-color);
    padding-bottom: 10px;
    align-items: center;
}
.tab-btn {
    background: transparent;
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.1em;
    transition: 0.2s;
}
.tab-btn:hover { background: rgba(128,128,128,0.2); }
.tab-btn.active-tab {
    background: var(--theme-color) !important;
    color: var(--bg-color) !important;
    text-shadow: none !important;
}
.tab-bar .spacer { flex-grow: 1; }
/* Clock grid */
.clock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}
.clock-card {
    border: 1px solid var(--theme-color);
    padding: 15px;
    background: rgba(128,128,128,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
}
.clock-card.classified {
    border-style: dashed;
    opacity: 0.85;
}
.clock-card.completed-card {
    border-color: #00ff00;
    background: rgba(0,255,0,0.04);
}
.clock-card .clock-name {
    font-size: 1.05em;
    font-weight: bold;
    text-align: center;
}
.clock-card .clock-subtitle {
    font-size: 0.85em;
    opacity: 0.7;
    text-align: center;
}
.clock-card .clock-timer-label {
    font-size: 0.85em;
    color: #00ccff;
}
.clock-card .clock-note {
    font-size: 0.8em;
    opacity: 0.6;
    text-align: center;
    font-style: italic;
}
.clock-svg { width: 140px; height: 140px; }
.clock-svg-interactive { cursor: pointer; }
.clock-svg-interactive:hover .clock-seg-lit { filter: drop-shadow(0 0 6px currentColor); }
.clock-svg-complete { opacity: 0.7; }
.clock-svg-paused { opacity: 0.5; }
.clock-controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
}
/* Terminal */
.term-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}
#clock-terminal {
    border: 1px solid var(--theme-color);
    padding: 10px;
    height: 160px;
    overflow-y: auto;
    background: rgba(0,0,0,0.5);
    color: var(--theme-color);
    margin-top: 5px;
    position: relative;
    z-index: 999998;
}
/* Modal */
#clock-modal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    border: 2px solid var(--theme-color);
    background: var(--bg-color);
    padding: 25px;
    z-index: 999999 !important;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.9);
    width: max-content;
    min-width: 400px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;
    pointer-events: auto !important;
}
#clock-modal h3 {
    margin-top: 0;
    border-bottom: 1px solid var(--theme-color);
    padding-bottom: 10px;
}
.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 20px;
}
.admin-input {
    background: var(--bg-color);
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    padding: 5px;
    font-family: inherit;
}
.tn-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}
/* Empty state */
.empty-state {
    text-align: center;
    font-style: italic;
    opacity: 0.6;
    padding: 40px 20px;
    grid-column: 1 / -1;
}
/* die-btn (inherited from style.css via character.html pattern) */
.die-btn {
    background: transparent;
    color: var(--theme-color);
    border: 1px solid var(--theme-color);
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9em;
    transition: 0.2s;
    outline: none;
}
.die-btn:hover {
    background: var(--theme-color);
    color: var(--bg-color);
    text-shadow: none;
}
.die-btn::before { content: "[ "; }
.die-btn::after { content: " ]"; }
.die-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.die-btn:disabled:hover { background: transparent; color: var(--theme-color); }
.del-btn { border-color: #ff3333; color: #ff3333; }
.del-btn:hover { background: #ff3333; color: var(--bg-color); }
.del-btn::before { content: ""; }
.del-btn::after { content: ""; }
</style>
</head>
<body>
<img id="bg-lambda"
     src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Orange_lambda.svg/1280px-Orange_lambda.svg.png"
     alt="Lambda Logo">

<div id="top-nav">
    <a href="/dashboard.html" class="nav-link">&lt; RETURN TO DASHBOARD</a>
    <span>DRAMATIC CLOCKS</span>
</div>

<div class="page-title">CLOCK TOWER</div>

<!-- Tab / Filter Bar -->
<div class="tab-bar">
    <button class="tab-btn active-tab" onclick="setFilter('active')">ACTIVE</button>
    <button class="tab-btn" onclick="setFilter('completed')">COMPLETED</button>
    <button class="tab-btn" onclick="setFilter('all')">ALL</button>
    <span class="spacer"></span>
    <button class="die-btn" onclick="openClockModal()">+ NEW CLOCK</button>
</div>

<!-- Clock Grid -->
<div class="clock-grid" id="clock-grid"></div>

<!-- Terminal -->
<div class="term-header">
    <span>&gt; CLOCK TERMINAL</span>
    <button class="die-btn" onclick="clearClockLog()">CLEAR LOG</button>
</div>
<div id="clock-terminal">
    <div>&gt; CLOCK TERMINAL READY. AWAITING INPUT...</div>
</div>

<!-- New / Edit Clock Modal -->
<div id="clock-modal">
    <h3 id="clock-modal-title">NEW CLOCK</h3>
    <div class="setting-row">
        <span>Name:</span>
        <input type="text" id="cm-name" class="admin-input" style="width:220px;">
    </div>
    <div class="setting-row">
        <span>Subtitle:</span>
        <input type="text" id="cm-subtitle" class="admin-input" style="width:220px;">
    </div>
    <div class="setting-row">
        <span>Segments:</span>
        <select id="cm-segments" class="admin-input">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6" selected>6</option>
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
        </select>
    </div>
    <div class="setting-row">
        <span>Direction:</span>
        <select id="cm-direction" class="admin-input">
            <option value="fill">Progress (fill to complete)</option>
            <option value="drain">Countdown (drain to complete)</option>
        </select>
    </div>
    <div class="setting-row">
        <span>Start filled:</span>
        <input type="number" id="cm-filled" class="admin-input" style="width:60px; text-align:center;" value="0" min="0" max="12">
    </div>
    <div class="setting-row">
        <span>Colour:</span>
        <select id="cm-color" class="admin-input"></select>
    </div>
    <div class="setting-row">
        <span>Who may tick:</span>
        <select id="cm-control" class="admin-input">
            <option value="gm">GM only</option>
            <option value="open">Open (table may tick)</option>
        </select>
    </div>
    <div class="setting-row">
        <span>Classified (GM-only view):</span>
        <input type="checkbox" id="cm-secret" style="width:20px; height:20px;">
    </div>
    <div class="setting-row">
        <span>Roll-to-advance die:</span>
        <select id="cm-rolldie" class="admin-input">
            <option value="4">d4</option>
            <option value="6" selected>d6</option>
            <option value="8">d8</option>
            <option value="10">d10</option>
            <option value="12">d12</option>
        </select>
    </div>
    <div class="setting-row">
        <span>+ Wild d6:</span>
        <input type="checkbox" id="cm-rollwild" style="width:20px; height:20px;">
    </div>
    <div class="setting-row">
        <span>Wall timer (minutes):</span>
        <input type="number" id="cm-timer" class="admin-input" style="width:70px; text-align:center;" value="0" min="0">
    </div>
    <div class="setting-row">
        <span>Completion note:</span>
        <input type="text" id="cm-note" class="admin-input" style="width:220px;">
    </div>
    <div class="tn-buttons">
        <button class="die-btn" onclick="saveClock()">SAVE</button>
        <button class="die-btn" onclick="closeClockModal()">CANCEL</button>
    </div>
</div>

<script src="/settings.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBt1ymfsEvbO1X9eYDVf2ctotRcbFFOO44",
    authDomain: "strangers-in-silence.firebaseapp.com",
    databaseURL: "https://strangers-in-silence-default-rtdb.firebaseio.com",
    projectId: "strangers-in-silence",
    storageBucket: "strangers-in-silence.firebasestorage.app",
    messagingSenderId: "62557473299",
    appId: "1:62557473299:web:e2ebf2ee2520a9189e8de6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const isAdmin = (currentUser === "Administrator");

let clocks = {};
let currentFilter = 'active';
let editingClockId = null;
let timerInterval = null;

// ---- Firebase listener ----
onValue(ref(db, 'campaignState/clocks'), (snap) => {
    clocks = snap.val() || {};
    renderClocks();
});

// ---- Timer polling (per-minute, never per-second) ----
function startTimerPoll() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        let changed = false;
        for (const [id, c] of Object.entries(clocks)) {
            if (!c.timerOn || c.status !== 'active') continue;
            let rem = window.Clocks.clockRemainingMs(c);
            if (rem !== null && rem <= 0) {
                c.status = 'completed';
                c.filled = 0;
                c.updatedAt = Date.now();
                set(ref(db, `campaignState/clocks/${id}`), c);
                logTerm(`> <b style="color:#00ff00;">TIMER COMPLETE:</b> ${c.name} has elapsed.`);
                changed = true;
            }
        }
        if (changed) renderClocks();
        else updateTimerLabels();
    }, 60000); // once per minute
}
startTimerPoll();

function updateTimerLabels() {
    document.querySelectorAll('.clock-timer-label').forEach(el => {
        let id = el.dataset.clockId;
        let c = clocks[id];
        if (!c || !c.timerOn) return;
        let rem = window.Clocks.clockRemainingMs(c);
        el.textContent = window.Clocks.formatClockMinutes(rem) + ' remaining';
    });
}

// ---- Rendering ----
function renderClocks() {
    const grid = document.getElementById('clock-grid');
    grid.innerHTML = '';
    let entries = Object.entries(clocks).map(([id, c]) => {
        c.id = id;
        return window.Clocks.normalizeClock(c);
    });

    // Filter
    if (currentFilter === 'active') entries = entries.filter(c => c.status !== 'completed');
    else if (currentFilter === 'completed') entries = entries.filter(c => c.status === 'completed');

    // Classified: hide from non-GM
    if (!isAdmin) entries = entries.filter(c => !c.secret);

    if (entries.length === 0) {
        grid.innerHTML = '<div class="empty-state">[ NO CLOCKS REGISTERED ]</div>';
        return;
    }

    entries.forEach(c => {
        let lit = window.Clocks.clockLitCount(c);
        let svg = window.Clocks.buildClockSVG(c, { lit, interactive: canTick(c) });
        let cardClass = 'clock-card'
            + (c.secret ? ' classified' : '')
            + (c.status === 'completed' ? ' completed-card' : '');

        let timerHtml = '';
        if (c.timerOn && c.timerMinutes > 0) {
            let rem = window.Clocks.clockRemainingMs(c);
            timerHtml = `<div class="clock-timer-label" data-clock-id="${c.id}">${window.Clocks.formatClockMinutes(rem)} remaining</div>`;
        }

        let controlsHtml = '';
        if (c.status !== 'completed') {
            if (canTick(c)) {
                controlsHtml += `<button class="die-btn" onclick="tickClock('${c.id}', 1)">+1</button>`;
                controlsHtml += `<button class="die-btn" onclick="tickClock('${c.id}', -1)">-1</button>`;
            }
            if (isAdmin) {
                if (c.timerOn) {
                    controlsHtml += `<button class="die-btn" onclick="toggleTimerPause('${c.id}')">${c.status === 'paused' ? 'RESUME' : 'PAUSE'}</button>`;
                }
                controlsHtml += `<button class="die-btn" onclick="openClockModal('${c.id}')">EDIT</button>`;
                controlsHtml += `<button class="die-btn" onclick="completeClock('${c.id}')">DONE</button>`;
                controlsHtml += `<button class="die-btn del-btn" onclick="deleteClock('${c.id}')">X</button>`;
            }
        } else if (isAdmin) {
            controlsHtml += `<button class="die-btn" onclick="reopenClock('${c.id}')">REOPEN</button>`;
            controlsHtml += `<button class="die-btn del-btn" onclick="deleteClock('${c.id}')">X</button>`;
        }

        grid.innerHTML += `
        <div class="${cardClass}">
            <div class="clock-name">${esc(c.name)}</div>
            ${c.subtitle ? `<div class="clock-subtitle">${esc(c.subtitle)}</div>` : ''}
            ${svg}
            <div style="font-size:0.9em; opacity:0.8;">${lit} / ${c.segments}</div>
            ${timerHtml}
            ${c.note ? `<div class="clock-note">${esc(c.note)}</div>` : ''}
            <div class="clock-controls">${controlsHtml}</div>
        </div>`;
    });

    // Wire SVG click-to-tick
    grid.querySelectorAll('.clock-svg-interactive').forEach(svg => {
        svg.addEventListener('click', () => {
            let id = svg.dataset.clockId;
            if (id) tickClock(id, 1);
        });
    });
}

function canTick(c) {
    if (c.status === 'completed' || c.status === 'paused') return false;
    if (c.control === 'open') return true;
    return isAdmin;
}

function esc(s) {
    return String(s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- Actions ----
window.setFilter = function(f) {
    currentFilter = f;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab'));
    event.target.classList.add('active-tab');
    renderClocks();
};

window.tickClock = async function(id, delta) {
    let c = clocks[id];
    if (!c) return;
    c = window.Clocks.normalizeClock(c);
    if (!canTick(c)) return;
    c._everTicked = true;
    c.filled = Math.max(0, Math.min(c.segments, (c.filled || 0) + delta));
    c.updatedAt = Date.now();
    if (window.Clocks.clockIsComplete(c)) {
        c.status = 'completed';
        logTerm(`> <b style="color:#00ff00;">CLOCK COMPLETE:</b> ${c.name}${c.note ? ' — ' + c.note : ''}`);
    }
    await set(ref(db, `campaignState/clocks/${id}`), c);
    renderClocks();
};

window.completeClock = async function(id) {
    let c = clocks[id];
    if (!c) return;
    c.status = 'completed';
    c.filled = (c.direction === 'drain') ? 0 : c.segments;
    c.updatedAt = Date.now();
    await set(ref(db, `campaignState/clocks/${id}`), c);
    logTerm(`> <b style="color:#00ff00;">CLOCK COMPLETED:</b> ${c.name}`);
    renderClocks();
};

window.reopenClock = async function(id) {
    let c = clocks[id];
    if (!c) return;
    c.status = 'active';
    c.updatedAt = Date.now();
    await set(ref(db, `campaignState/clocks/${id}`), c);
    renderClocks();
};

window.deleteClock = async function(id) {
    if (!confirm('Delete this clock permanently?')) return;
    await remove(ref(db, `campaignState/clocks/${id}`));
    logTerm(`> Clock deleted.`);
    renderClocks();
};

window.toggleTimerPause = async function(id) {
    let c = clocks[id];
    if (!c) return;
    if (c.status === 'paused') {
        window.Clocks.resumeClockTimer(c);
    } else {
        window.Clocks.freezeClockTimer(c);
    }
    c.updatedAt = Date.now();
    await set(ref(db, `campaignState/clocks/${id}`), c);
    renderClocks();
};

// ---- Modal ----
window.openClockModal = function(id) {
    editingClockId = id || null;
    document.getElementById('clock-modal-title').textContent = id ? 'EDIT CLOCK' : 'NEW CLOCK';

    // Populate colour dropdown
    let colorSel = document.getElementById('cm-color');
    colorSel.innerHTML = CLOCKS_PALETTE.map(p =>
        `<option value="${p.id}">${p.label}</option>`
    ).join('');

    if (id && clocks[id]) {
        let c = window.Clocks.normalizeClock(clocks[id]);
        document.getElementById('cm-name').value = c.name;
        document.getElementById('cm-subtitle').value = c.subtitle;
        document.getElementById('cm-segments').value = c.segments;
        document.getElementById('cm-direction').value = c.direction;
        document.getElementById('cm-filled').value = c.filled;
        document.getElementById('cm-color').value = c.colorId || 'theme';
        document.getElementById('cm-control').value = c.control;
        document.getElementById('cm-secret').checked = c.secret;
        document.getElementById('cm-rolldie').value = c.rollDie;
        document.getElementById('cm-rollwild').checked = c.rollWild;
        document.getElementById('cm-timer').value = c.timerMinutes;
        document.getElementById('cm-note').value = c.note;
    } else {
        document.getElementById('cm-name').value = '';
        document.getElementById('cm-subtitle').value = '';
        document.getElementById('cm-segments').value = '6';
        document.getElementById('cm-direction').value = 'fill';
        document.getElementById('cm-filled').value = '0';
        document.getElementById('cm-color').value = 'theme';
        document.getElementById('cm-control').value = 'gm';
        document.getElementById('cm-secret').checked = false;
        document.getElementById('cm-rolldie').value = '6';
        document.getElementById('cm-rollwild').checked = false;
        document.getElementById('cm-timer').value = '0';
        document.getElementById('cm-note').value = '';
    }
    document.getElementById('clock-modal').style.display = 'block';
};

window.closeClockModal = function() {
    document.getElementById('clock-modal').style.display = 'none';
    editingClockId = null;
};

window.saveClock = async function() {
    let name = document.getElementById('cm-name').value.trim();
    if (!name) { alert('Clock needs a name.'); return; }

    let c = editingClockId ? JSON.parse(JSON.stringify(clocks[editingClockId])) : {};
    c.name = name;
    c.subtitle = document.getElementById('cm-subtitle').value.trim();
    c.segments = parseInt(document.getElementById('cm-segments').value);
    c.direction = document.getElementById('cm-direction').value;
    c.filled = parseInt(document.getElementById('cm-filled').value) || 0;
    c.colorId = document.getElementById('cm-color').value;
    c.colorHex = null;
    c.control = document.getElementById('cm-control').value;
    c.secret = document.getElementById('cm-secret').checked;
    c.rollDie = parseInt(document.getElementById('cm-rolldie').value);
    c.rollWild = document.getElementById('cm-rollwild').checked;
    c.timerMinutes = parseInt(document.getElementById('cm-timer').value) || 0;
    c.timerOn = c.timerMinutes > 0;
    c.note = document.getElementById('cm-note').value.trim();
    c.updatedAt = Date.now();

    if (!editingClockId) {
        c = window.Clocks.normalizeClock(c, true);
        let id = c.id;
        await set(ref(db, `campaignState/clocks/${id}`), c);
        logTerm(`> Clock created: <b>${esc(c.name)}</b> (${c.segments} segments, ${c.direction}).`);
    } else {
        c = window.Clocks.normalizeClock(c);
        await set(ref(db, `campaignState/clocks/${editingClockId}`), c);
        logTerm(`> Clock updated: <b>${esc(c.name)}</b>.`);
    }

    closeClockModal();
    renderClocks();
};

// ---- Terminal ----
function logTerm(html) {
    const term = document.getElementById('clock-terminal');
    const div = document.createElement('div');
    div.style.marginBottom = '6px';
    div.innerHTML = html;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
}
window.clearClockLog = function() {
    document.getElementById('clock-terminal').innerHTML = '<div>&gt; CLOCK TERMINAL READY. AWAITING INPUT...</div>';
};

// ---- Init ----
renderClocks();
</script>
</body>
</html>
